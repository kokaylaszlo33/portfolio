<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      header {
        background: #333;
        color: #fff;
        padding: 1rem 0;
        text-align: center;
      }
      nav {
        background: #444;
        padding: 1rem;
        text-align: center;
      }
      nav a {
        color: #fff;
        margin: 0 1rem;
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      section {
        margin: 2rem 0;
      }
      h2 {
        margin-bottom: 1rem;
        color: #333;
      }
      footer {
        background: #333;
        color: #fff;
        text-align: center;
        padding: 1rem;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome to My Portfolio</h1>
    </header>

    <nav>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

    <main>
      <section id="about">
        <h2>About Me</h2>
        <p>Hello! I'm a developer passionate about creating web experiences.</p>
      </section>

      <section id="projects">
        <h2>Projects</h2>
        <p>Here are some of my recent projects...</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Email: your@email.com</p>
      </section>
    </main>

    <footer>
      <p>&copy; 2027 My Portfolio. All rights reserved.</p>
    </footer>
  </body>
</html>
